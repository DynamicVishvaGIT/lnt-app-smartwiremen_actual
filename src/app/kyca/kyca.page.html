<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon color="light" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>KYC Details</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-row>
    <ion-col size="12" class="ion-no-padding">
      <ion-card class="ion-no-padding">
        <ion-card-content>
          <ion-card-subtitle>Pan & Aadhaar Linked Mobile Number</ion-card-subtitle>
          <ion-card-title>{{kyc_status.linked_phonenumber}}</ion-card-title>
        </ion-card-content>
      </ion-card>
    </ion-col>
  </ion-row>
  <ion-row>
    <ion-col size="12" class="ion-no-padding">
    <ion-card class="ion-no-padding">
      <ion-card-header>
        <img src="{{kyc_status.pan_card_img}}" alt="">
      </ion-card-header>
      <ion-card-content>
        <ion-card-subtitle>Pan Card Number</ion-card-subtitle>
        <ion-card-title>{{kyc_status.pan_card_no}}</ion-card-title>
      </ion-card-content>
    </ion-card>
  </ion-col>
  </ion-row>
  <ion-row>
    <ion-col size="12" class="ion-no-padding">
    <ion-card class="ion-no-padding">
      <ion-card-header>
        <img src="{{kyc_status.aadhar_img}}" alt="">
      </ion-card-header>
      <ion-card-content>
        <ion-card-subtitle>Aadhaar Card Number</ion-card-subtitle>
        <ion-card-title>{{kyc_status.aadhar_no}}</ion-card-title>
      </ion-card-content>
    </ion-card>
  </ion-col>
  </ion-row>
  <ion-row>
    <ion-col size="12" class="ion-no-padding">
    <ion-card class="ion-no-padding">
      <ion-card-header>
        <img src="{{kyc_status.cancel_check_img}}" alt="">
      </ion-card-header>
      <ion-card-content>
        <ion-card-subtitle>Cancel Cheque Number</ion-card-subtitle>
        <ion-card-title>{{kyc_status.cancel_check_no}}</ion-card-title>
      </ion-card-content>
    </ion-card>
  </ion-col>
  </ion-row>
</ion-content>
