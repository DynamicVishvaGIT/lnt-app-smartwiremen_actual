<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon color="light" name="arrow-back-outline" ></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Project Lead List</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card *ngFor="let project of projects_list">
    <ion-card-content>
    <p>
      {{project.pr_name}}
    </p>
        <!-- <p>{{project.pr_stage}}</p>
        <ion-row>
          <ion-col size="6">
            <p><ion-icon name="calendar"></ion-icon> {{project.order_month}}</p>
          </ion-col>
          <ion-col size="6">
            <p class="ion-text-end">{{project.pr_status}}</p>
          </ion-col>
        </ion-row> -->
        <div class="submit-btn">
          <ion-button color="secondary"    expand="block" (click)="goToProjectdetails(project.pr_id)">
            VIEW PROJECT
           </ion-button>
          </div>
    </ion-card-content>
  </ion-card> 
  <ion-card class="no-records" *ngIf="projects_list?.length == 0">
    <ion-label style="text-align: center;font-weight: bold;">No Records Found</ion-label>
  </ion-card>
</ion-content>
