
<ion-content>
  <div class="logo-pos">
    <img src="assets/logo/Lauritz_Knudsen.svg" class="logo">
  </div>
  <div class="header-align">
    <p style="font-size: 28px;font-weight: 600;padding-left: 4px;">Sign In</p>  
    <p style="font-size: 15px;margin-top: -16px;color: #00000080;padding-left: 4px;">Enter your details to proceed further</p>  
  </div>
  <div mode="ios" class="content-align">
    <form (ngSubmit)="loginForm()">
      <ion-row>
        <ion-col size="12">
          <ion-label class="required" style="color: black!important;font-size: small;font-weight: 500;">Username(Primary mobile number)</ion-label>
          <ion-item lines="none" class="ion-item" style="margin-top: 8px;">
            <ion-input type="tel" maxLength="10" [(ngModel)]="loginFormField.username" name="username"  placeholder="{{ 'enter_mobile_no' | translate }}" class="ion-input" >
              <ion-icon slot="start" name="call" aria-hidden="true" class="icon-align"></ion-icon>
            </ion-input>
          </ion-item> 
        </ion-col>
      </ion-row>
      <br>
      <ion-row>
        <ion-col size="12">
          <ion-button type="submit" color="primary" class="login-btn" expand="block">
            {{ 'sign_in' | translate }}
          </ion-button>
        </ion-col>
      </ion-row>
    </form>
  </div>
</ion-content>
