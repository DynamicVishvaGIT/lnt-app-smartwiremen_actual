<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon color="light" name="arrow-back-outline" ></ion-icon>
      </ion-button>
      </ion-buttons>
    <ion-title>{{ 'passbook' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher (ionRefresh)="doRefresh($event)" slot="fixed">
    <ion-refresher-content >
    </ion-refresher-content>
</ion-refresher>
<ion-list *ngFor="let item of items" >
  
  <ion-card *ngIf="items.length > 0">
    <ion-item>
      <ion-label>{{ 'promo_code' | translate}}</ion-label>
      <ion-label>{{item.code}}</ion-label>
    </ion-item>

    <ion-item>
      <ion-label>{{'passbook_product_name' | translate}}</ion-label>
      <ion-label>{{item.product_name}}</ion-label>
    </ion-item>

    <ion-item>
      <ion-label>{{'created_by' | translate}}</ion-label>
      <ion-label>{{item.created_by}}</ion-label>
    </ion-item>

    <ion-item>
      <ion-label>{{'points' | translate}}</ion-label>
      <ion-label>{{item.point}}</ion-label>
    </ion-item>

    <ion-item>
      <ion-label>{{'created_at' | translate}}</ion-label>
      <ion-label>{{item.created_at}}</ion-label>
    </ion-item>
  </ion-card>
  
</ion-list>

<ion-card class="no-records" *ngIf="items.length == 0">
  <ion-label style="text-align: center;font-weight: bold;">No Records Found</ion-label>
</ion-card>

</ion-content>
