export default "\n<ion-content></ion-content>\n\n<div class=\"inner-content\">\n\n  <form (ngSubmit)=\"addLeadForm()\">\n    <ion-row  class=\"ion-margin-bottom\" style=\"border-bottom: 1px solid;\">\n      <ion-col  size=\"2\">\n        <ion-icon style=\"font-weight: bold;\n        font-size: 22px;\n        margin-left: 14px;\" name=\"close\" (click)=\"closeDrawer('')\"></ion-icon>\n      </ion-col>\n      <ion-col size=\"9\" style=\"font-size: 20px;\n      font-weight: bold;\n      text-align: center;margin: -9px;\n     \">\n        <p class=\"ion-text-center\" style=\"margin: 10px;margin-left: -22px;\">Add {{type |titlecase }}</p>\n      </ion-col>\n    </ion-row>\n    <ion-row class=\"ion-margin-bottom\" style=\"padding: 0 18px;\">\n      <ion-input type=\"number\" [(ngModel)]=\"addLeadFormField.username\" name=\"username\" placeholder=\"Username (Primary mobile no) *\"></ion-input>\n    </ion-row>\n    <ion-row class=\"ion-margin-bottom\" style=\"padding: 0 18px;\">\n      <ion-input type=\"text\" [(ngModel)]=\"addLeadFormField.first_name\" name=\"first_name\" placeholder=\"First Name *\"></ion-input>\n    </ion-row>\n    <ion-row class=\"ion-margin-bottom\" style=\"padding: 0 18px;\">\n      <ion-input type=\"text\" [(ngModel)]=\"addLeadFormField.last_name\" name=\"last_name\" placeholder=\"Last Name  *\"></ion-input>\n    </ion-row>\n    <div class=\"submit-btn\" type=\"submit\" style=\"padding: 0 10px;\" >\n      <ion-button color=\"secondary\"  expand=\"block\" >\n          Add\n       </ion-button>\n      </div>\n      </form>\n  </div>";
