export default "<ion-header class=\"ion-no-border\">\n</ion-header>\n<ion-content>\n  <div style=\"margin-top: 10%;text-align:center;\">\n    <p style=\"color:black;font-size: large;font-weight: 800;\">OTP</p>\n  </div>\n  <div style=\"margin-top:15%;text-align:start;margin-left: 15px;\">\n    <p style=\"color:black;font-size: large;font-weight: 800;\">Verify with OTP</p>\n    <p style=\"color:black\">OTP sent to your mobile no.  +91 {{mobile_no}}</p>\n  </div>\n  <div class=\"ion-text-center\">\n    <a >Change</a>\n  </div>\n  <div style=\"margin-top:10%;margin-left: -153px;\">\n    <app-custom-otp-input [length]=\"4\" (otpChange)=\"handleOtpChange($event)\" #otpInput></app-custom-otp-input>\n    <!-- <ng-otp-input #ngOtpInput\n    [config]=\"{\n      allowNumbersOnly: true,\n      length: 5,\n      isPasswordInput: false,\n      disableAutoFocus: false,\n      placeholder:'',\n      inputStyles: {\n      'color':'#ffff',\n      'text-align':'center',\n      'background': '#071947',\n      'width': '50px',\n      'height': '50px',\n      'border-radius':'8px'\n      }\n    }\"> \n    </ng-otp-input> -->\n    <p class=\"resend_otp\"><span style=\"color:#0000;font-size: smaller;\">Resend OTP in 30s</span></p>\n  </div>\n</ion-content>\n<ion-footer class=\"ion-no-border\" style=\"padding: 10px;background: #ffff;\">\n  <ion-toolbar position=\"bottom\">\n    <ion-button color=\"primary\" class=\"login-btn\" (click)=\"verifyOTP()\">Verify</ion-button>\n  </ion-toolbar>\n</ion-footer>\n\n\n\n<!-- <ion-header>\n  <ion-toolbar>\n    <ion-title>Mobile Number Verification</ion-title>\n    <ion-buttons slot=\"end\"><ion-button  (click)=\"doLogout()\" class=\"logoutbtn\"><ion-icon name=\"md-log-out\"></ion-icon></ion-button></ion-buttons>\n\n  </ion-toolbar>\n</ion-header>\n\n<ion-content class=\"ion-padding\">\n  <ion-row>\n    <ion-col class=\"ion-text-center\">\n      <h4>{{ mobile_no }}</h4>\n      <h6>{{ 'mobile_no_verification' | translate }}</h6>\n    </ion-col>\n  </ion-row>\n\n  <form (ngSubmit)=\"submitOTPForm()\" *ngIf=\"otp_send\">\n   \n      <ion-input  type=\"number\" placeholder=\"{{ 'enter_otp' | translate }}\" class=\"otp-input\" [(ngModel)]=\"inputCode\" name=\"inputCode\"></ion-input>\n  \n    <ion-button class=\"btn-create\" style=\"--color: #ffffff;\"  expand=\"block\" type=\"submit\">{{ 'verify' | translate }}</ion-button>\n</form>\n\n<ion-card *ngIf=\"timer && otp_send\" class=\"card_timer no-padding\">\n  <ion-card-content class=\"no-padding\">\n    <ion-button  *ngIf=\"timeInSeconds && timeInSeconds > 0\" size=\"large\" expand=\"block\" fill=\"clear\" class=\"timer-button x-large\">{{ 'time_left' | translate }} : {{timer.displayTime}}</ion-button>\n  </ion-card-content>\n</ion-card>\n<ion-button  *ngIf=\"!otp_send\" class=\"btn-create\"   expand=\"block\" (click)=\"sendOTP()\" color=\"secondary\">{{ 'send_otp' | translate }}</ion-button>\n</ion-content> -->\n";
