export default "<ion-content class=\"ion-padding\">\n  <ion-row>\n  <ion-col size=\"2\">\n    <ion-icon style=\"font-weight: bold;\n    font-size: 22px;\n    \" name=\"close-circle\" (click)=\"closeDrawer()\"></ion-icon>\n  </ion-col>\n  <ion-col size=\"10\" style=\"text-align: right;\">\n    Closes Ad in  <b>{{counter}}</b> seconds\n  </ion-col>\n  </ion-row>\n <br>\n  <ion-row class=\"app-icon-container\" style=\"margin-top: 40%;\"> \n    <ion-col class=\"ion-text-center\">\n      <img src=\"../../assets/imgs/logo.png\" />      \n    </ion-col>\n  </ion-row>\n<br>\n\n</ion-content>";
