export default "<ion-header>\n  <ion-toolbar>\n    <ion-buttons slot=\"start\">\n      <ion-button (click)=\"goBack()\">\n        <ion-icon color=\"light\" name=\"arrow-back-outline\" ></ion-icon>\n      </ion-button>\n    </ion-buttons>\n    <ion-title>Project Lead List</ion-title>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content>\n  <ion-card *ngFor=\"let project of projects_list\">\n    <ion-card-content>\n    <p>\n      {{project.pr_name}}\n    </p>\n        <!-- <p>{{project.pr_stage}}</p>\n        <ion-row>\n          <ion-col size=\"6\">\n            <p><ion-icon name=\"calendar\"></ion-icon> {{project.order_month}}</p>\n          </ion-col>\n          <ion-col size=\"6\">\n            <p class=\"ion-text-end\">{{project.pr_status}}</p>\n          </ion-col>\n        </ion-row> -->\n        <div class=\"submit-btn\">\n          <ion-button color=\"secondary\"    expand=\"block\" (click)=\"goToProjectdetails(project.pr_id)\">\n            VIEW PROJECT\n           </ion-button>\n          </div>\n    </ion-card-content>\n  </ion-card> \n  <ion-card class=\"no-records\" *ngIf=\"projects_list?.length == 0\">\n    <ion-label style=\"text-align: center;font-weight: bold;\">No Records Found</ion-label>\n  </ion-card>\n</ion-content>\n";
