export default "<!-- <ion-header>\n  <ion-toolbar>\n    <ion-buttons slot=\"start\">\n      <ion-button (click)=\"goBack()\">\n        <ion-icon color=\"light\" name=\"arrow-back-outline\" ></ion-icon>\n      </ion-button>\n    </ion-buttons>\n    <ion-title>{{ 'scheme_n_offers' | translate }}</ion-title>\n  </ion-toolbar>\n</ion-header> -->\n\n<ion-content class=\"ion-padding\">\n  <ion-refresher  slot=\"fixed\" (ionRefresh)=\"doRefresh($event)\">\n    <ion-refresher-content>\n    </ion-refresher-content>\n  </ion-refresher>\n  <div class=\"ion-padding-top ion-padding-horizontal\">\n    <ion-grid>\n      <ion-row>\n        <ion-col size=\"2\" style=\"text-align: start;margin-left: -28px;\" (click)=\"goBack()\">\n          <ion-icon name=\"chevron-back-outline\"></ion-icon>\n          <!-- <ion-menu-button></ion-menu-button> -->\n        </ion-col>\n        <ion-col size=\"8\" style=\"text-align: center;\">\n          <strong class=\"header\" style=\"color:#131313;\">{{ 'scheme_n_offers' | translate }}</strong>\n        </ion-col>\n      </ion-row>\n    </ion-grid>\n  </div>\n  <ion-list class=\"gap\">\n\t  <ion-item lines=\"none\" *ngFor=\"let item of items\" (click)=\"itemSelected(item)\">\n\t    {{ item.title }}\n      <ion-icon slot=\"end\" name=\"caret-forward-circle-sharp\" color=\"secondary\"></ion-icon>\n\t  </ion-item>  \n\t</ion-list>\n</ion-content>\n";
