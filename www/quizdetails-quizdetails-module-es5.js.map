export default "<ion-header>\n  <ion-toolbar>\n    <ion-buttons slot=\"start\">\n      <ion-button (click)=\"goBack()\">\n        <ion-icon color=\"light\" name=\"arrow-back-outline\" ></ion-icon>\n      </ion-button>\n    </ion-buttons>\n    <ion-title>Game</ion-title>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content class=\"ion-padding\">\n  <ion-refresher slot=\"fixed\" (ionRefresh)=\"doRefresh($event)\">\n    <ion-refresher-content></ion-refresher-content>\n  </ion-refresher>\n  <div *ngIf=\"questions\">\n  <div *ngFor=\"let question of questions; let i = index;\">\n\n    <ion-card mode=\"ios\" >\n      <ion-card-header>\n        <ion-card-subtitle style=\"font-size: 20px;\">Q.{{i+1}} {{question.Q.question|titlecase}} </ion-card-subtitle>\n      </ion-card-header>\n      <ion-card-content>\n    <form>\n        <ion-radio-group \n        allowEmptySelection=\"false\" mode=\"md\" [(ngModel)]=\"quiz_answer[i]\"  name=\"quiz_answer\" >\n          <ion-list-header>\n            <ion-label style=\"text-align: left;\">Please select one</ion-label>\n          </ion-list-header>\n          <ion-item *ngFor=\"let item of question.O\">\n            <ion-label class=\"ion-text-wrap\">\n            {{item.question_option |titlecase}}\n              </ion-label>\n            <ion-radio  slot=\"start\" value=\"{{item.option_id}},{{item.question_id}}\"></ion-radio>\n            <br>\n          </ion-item>\n      \n        </ion-radio-group>\n        </form>\n      </ion-card-content>\n      </ion-card>\n  </div>\n  \n  <div>\n    <ion-button  *ngIf=\"questions\" expand=\"block\" class=\"answer-question ion-margin\" (click)=\"submitQuestions()\">{{'submit' |translate}}</ion-button>\n  </div>\n</div>\n</ion-content>\n";
