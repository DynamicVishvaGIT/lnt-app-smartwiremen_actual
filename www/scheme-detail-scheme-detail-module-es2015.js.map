export default "<ion-header>\n  <ion-toolbar>\n    <ion-title>{{ scheme.title }}</ion-title>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content class=\"ion-padding\">\n  <img src=\"https://smartwiremen.com/storage/scheme_images/{{ scheme.scheme_image }}\" *ngIf=\"scheme.scheme_image\"/>\n  <ion-row  *ngIf=\"scheme.scheme_pdf\">\n    <ion-col size=\"12\" class=\"ion-text-right\" class=\"ion-no-padding\">\n      <ion-button color=\"secondary\"  size=\"small\" (click)=\"showPDF()\"><ion-icon name=\"cloud-download-sharp\"></ion-icon> Scheme Information PDF</ion-button>\n    </ion-col>\n  </ion-row>\n  <p style=\"white-space: pre-line; margin-top: 0px;\">\n\t\t{{ scheme.description }}\n\t</p>\n</ion-content>\n";
