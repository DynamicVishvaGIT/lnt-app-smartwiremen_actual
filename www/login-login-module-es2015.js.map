export default "\n<ion-content>\n  <div class=\"logo-pos\">\n    <img src=\"assets/logo/Lauritz_Knudsen.svg\" class=\"logo\">\n  </div>\n  <div class=\"header-align\">\n    <p style=\"font-size: 28px;font-weight: 600;padding-left: 4px;\">Sign In</p>  \n    <p style=\"font-size: 15px;margin-top: -16px;color: #00000080;padding-left: 4px;\">Enter your details to proceed further</p>  \n  </div>\n  <div mode=\"ios\" class=\"content-align\">\n    <form (ngSubmit)=\"loginForm()\">\n      <ion-row>\n        <ion-col size=\"12\">\n          <ion-label class=\"required\" style=\"color: black!important;font-size: small;font-weight: 500;\">Username(Primary mobile number)</ion-label>\n          <ion-item lines=\"none\" class=\"ion-item\" style=\"margin-top: 8px;\">\n            <ion-input type=\"tel\" maxLength=\"10\" [(ngModel)]=\"loginFormField.username\" name=\"username\"  placeholder=\"{{ 'enter_mobile_no' | translate }}\" class=\"ion-input\" >\n              <ion-icon slot=\"start\" name=\"call\" aria-hidden=\"true\" class=\"icon-align\"></ion-icon>\n            </ion-input>\n          </ion-item> \n        </ion-col>\n      </ion-row>\n      <br>\n      <ion-row>\n        <ion-col size=\"12\">\n          <ion-button type=\"submit\" color=\"primary\" class=\"login-btn\" expand=\"block\">\n            {{ 'sign_in' | translate }}\n          </ion-button>\n        </ion-col>\n      </ion-row>\n    </form>\n  </div>\n</ion-content>\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n<!-- <ion-content class=\"ion-padding\">\n  <ion-row class=\"app-icon-container\">\n    <ion-col class=\"ion-text-center\">\n      <img src=\"../../assets/imgs/logo.png\" />      \n    </ion-col>\n  </ion-row>\n  <form (ngSubmit)=\"loginForm()\">\n    <ion-row>\n      <ion-item class=\"ion-margin-bottom\">\n        <ion-label ><ion-icon slot=\"start\" name=\"call-sharp\"></ion-icon></ion-label>\n        <ion-input type=\"tel\" maxLength=\"10\" [(ngModel)]=\"loginFormField.username\" name=\"username\" placeholder=\"{{ 'enter_mobile_no' | translate }}\"></ion-input>\n      </ion-item>\n    </ion-row>\n    <ion-button class=\"login-btn\" size=\"default\" strong=\"true\" color=\"secondary\"  expand=\"block\" shape=\"round\" type=\"submit\">\n      <ion-icon class=\"log-icon\"  name=\"md-log-in\"  ></ion-icon> {{ 'sign_in' | translate }}\n    </ion-button>\n  </form>  \n  <br>\n  <ion-row class=\"center\">\n    <ion-col size=\"12\" class=\"sign-up-link\">\n      {{ 'dont_have_account' | translate }} <button (click)=\"goSignup()\"> <ion-icon name=\"lock-closed\"></ion-icon> {{ 'sign_up' | translate }} </button>\n    </ion-col>\n  </ion-row>\n</ion-content> -->\n";
