export default "<ion-header>\n  <ion-toolbar>\n    <ion-buttons slot=\"start\">\n      <ion-button (click)=\"goBack()\">\n        <ion-icon color=\"light\" name=\"arrow-back-outline\" ></ion-icon>\n      </ion-button>\n    </ion-buttons>\n    <ion-title>{{ 'change_lang' | translate }} </ion-title>\n\n  </ion-toolbar>\n</ion-header>\n\n<ion-content class=\"ion-padding\">\n  <ion-list>\n    <ion-radio-group [(ngModel)]=\"default_lang\" (ionChange)=\"changeLang($event)\">\n\n      <ion-item *ngFor=\"let l of langs\">\n        <ion-label>{{l.title}}</ion-label>\n        <ion-radio color=\"primary\" slot=\"end\" value=\"{{l.value}}\" ></ion-radio>\n      </ion-item>\n      \n    </ion-radio-group>\n  </ion-list>\n\n</ion-content>\n";
